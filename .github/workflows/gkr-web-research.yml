name: GKR full-board web research

on:
  workflow_dispatch:
    inputs:
      board_run_id:
        description: Run ID of a recent PrizePicks board pull with its board artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  research:
    # Disabled after metered charges on 2026-09-24. Require an explicit budget gate before re-enabling.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RESEARCH_PROVIDER: openai_web
      WEB_RESEARCH_MAX_SEARCHES: '1500'
      WEB_RESEARCH_CONCURRENCY: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check research key
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo 'OPENAI_API_KEY is unavailable to this workflow.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: prizepicks-board
          run-id: ${{ inputs.board_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gkr-board
      - run: npm ci
      - name: Search every event-player group and save cited websites
        env:
          CROWNIQ_RESEARCH_CATALOG_FILE: ${{ github.workspace }}/data/gkr-source-catalog.json
        run: |
          mkdir -p "${{ runner.temp }}/gkr-research"
          npm run run:research -w @crowniq/api -- \
            "${{ runner.temp }}/gkr-board/board.json" \
            "${{ runner.temp }}/gkr-research/research-result.json"
      - name: Retain source catalog and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gkr-web-research
          path: |
            ${{ runner.temp }}/gkr-research/research-result.json
            data/gkr-source-catalog.json
          if-no-files-found: ignore
          retention-days: 90
