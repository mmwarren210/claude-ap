name: PrizePicks board pull

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full_board:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check key availability
        run: |
          if [[ -z "$THE_ODDS_API_KEY" ]]; then
            echo 'The Odds API secret THE_ODDS_API is unavailable to this workflow.'
            exit 1
          fi
      - run: npm ci
      - name: Pull the complete available PrizePicks prop board
        env:
          CROWNIQ_PULL_OUTPUT_DIR: ${{ runner.temp }}/crowniq-prizepicks
        run: |
          npm run pull:prizepicks -w @crowniq/api
      - name: Store board and coverage for review
        uses: actions/upload-artifact@v4
        with:
          name: prizepicks-board
          path: ${{ runner.temp }}/crowniq-prizepicks
          retention-days: 1
