name: PrizePicks alternate field check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API }}
    steps:
      - name: Inspect one PrizePicks NFL alternate outcome without exposing players or credentials
        run: |
          node --input-type=module <<'NODE'
          const key = process.env.THE_ODDS_API_KEY;
          if (!key) throw new Error('THE_ODDS_API_SECRET_UNAVAILABLE');
          const base = 'https://api.the-odds-api.com';
          async function get(path, params = {}) {
            const url = new URL(path, base);
            url.searchParams.set('apiKey', key);
            for (const [name, value] of Object.entries(params)) url.searchParams.set(name, value);
            const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
            if (!response.ok) throw new Error(`ODDS_API_HTTP_${response.status}`);
            return { data: await response.json(), cost: response.headers.get('x-requests-last') };
          }
          const sport = 'americanfootball_nfl';
          const market = 'player_pass_yds_alternate';
          const events = (await get(`/v4/sports/${sport}/events`)).data;
          let inspected = 0;
          for (const event of events.slice(0, 8)) {
            inspected++;
            const path = `/v4/sports/${sport}/events/${encodeURIComponent(event.id)}`;
            const listing = (await get(`${path}/markets`, { bookmakers: 'prizepicks' })).data;
            const markets = listing.bookmakers?.find(book => book.key === 'prizepicks')?.markets ?? [];
            if (!markets.some(item => item.key === market)) continue;
            const odds = await get(`${path}/odds`, { bookmakers: 'prizepicks', markets: market,
              includeMultipliers: 'true', includeSids: 'true' });
            const outcomes = odds.data.bookmakers?.find(book => book.key === 'prizepicks')
              ?.markets?.find(item => item.key === market)?.outcomes ?? [];
            const sample = outcomes.find(item => item.name === 'Over' || item.name === 'Under');
            const multipliers = outcomes.map(item => item.multiplier);
            console.log(JSON.stringify({ checkedEvents: inspected, market, oddsCost: odds.cost,
              outcomeCount: outcomes.length, keys: sample ? Object.keys(sample).sort() : [],
              multiplierPresent: sample ? Object.hasOwn(sample, 'multiplier') : false,
              multiplierNull: sample ? sample.multiplier === null : null,
              nonNullMultipliers: multipliers.filter(item => item != null).length,
              multiplierKeys: multipliers.filter(item => item && typeof item === 'object')
                .slice(0, 1).flatMap(item => Object.keys(item)) }));
            process.exit(0);
          }
          console.log(JSON.stringify({ checkedEvents: inspected, market, result: 'NO_MATCHING_EVENT' }));
          NODE
